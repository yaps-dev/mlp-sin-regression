[project]
name = "ml-monitor"
version = "0.1.0"
description = "ML monitoring PoC: sine function generator + drift detection"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "fastapi>=0.100",
    "pydantic>=2.0",
    "prometheus-fastapi-instrumentator>=6.1",
    "uvicorn[standard]>=0.23",  # [standard] dorzuca httptools + uvloop
    "sqlalchemy>=2.0.49",
    "psycopg2-binary",
    "pandas",
    "numpy>=1.26,<2.1",
    "fastapi[standard]>=0.115,<0.137",
]

[project.optional-dependencies]

drift = [
    "evidently==0.6.7"
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]