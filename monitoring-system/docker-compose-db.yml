services:
  database_postgres:
    image: postgres:latest
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: username
      POSTGRES_DB: ml_data
    volumes:
      - C:/PROJ_AI_MASTERY/ml-monitoring-system-deployment/postgres-data/:/var/lib/postgresql
  pgadmin:
    image: dpage/pgadmin4:8.4
    ports:
      - 5480:80
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@domain.com
      PGADMIN_DEFAULT_PASSWORD: password